plugins {
    id 'com.android.application' version '9.4.1'
}

// 发布签名：同目录下有 keystore.properties 就用它，没有就退回 debug 签名，
// 这样别人 clone 下来不配密钥也能直接构建。密钥文件不要入库（见 .gitignore）。
def keystorePropertiesFile = file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'cc.thonly.app'
    compileSdk 35

    defaultConfig {
        applicationId 'cc.thonly.app'
        minSdk 23
        targetSdk 34
        versionCode 10
        versionName '1.5.3'
        resConfigs 'zh', 'en'
    }

    if (keystorePropertiesFile.exists()) {
        signingConfigs {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }
}

// 本项目刻意不引入任何第三方依赖（无 AndroidX / 无 Kotlin stdlib），
// 安装包才能压到几百 KB。加依赖前请先掂量体积。
dependencies {
}
