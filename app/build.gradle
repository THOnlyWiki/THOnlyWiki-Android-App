plugins {
    id 'com.android.application'
}

android {
    namespace 'cc.thonly.app'
    compileSdk 35

    defaultConfig {
        applicationId 'cc.thonly.app'
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName '1.3.0'
        resConfigs 'zh', 'en'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 群内直装先用 debug 签名，能直接装。要长期维护请换成自己的 keystore，
            // 见 README「签名」一节，否则换机器打包会导致无法覆盖安装。
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }
}

// 本项目刻意不引入任何第三方依赖（无 AndroidX / 无 Kotlin stdlib），
// 安装包才能压到几百 KB。加依赖前请先掂量体积。
dependencies {
}
